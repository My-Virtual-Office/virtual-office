<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Office — Defence</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Virtual Office — defence deck.

   The palette is lifted verbatim from the product's own default theme
   (website/src/theme/themes.css, "aubergine"), and the layout deliberately
   echoes the app's chrome: a dark rail, an aubergine band, a white content
   pane. The deck should look like it came out of the product, not off a
   template.

   Type is flush-left and editorial; colour is used in flat blocks, never as a
   decorative gradient.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  /* straight from the app */
  --rail:#3a083c; --rail-icon:#4a154b; --aubergine:#3f0e40; --aubergine-dark:#350d36;
  --aubergine-line:#522653; --mauve:#cfc3cf; --mauve-dim:#bca8bc;
  --blue:#1164a3; --ink:#1d1c1d; --muted:#616061; --rule:#e8e8e8; --wash:#f8f8f8;
  --paper:#ffffff;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--rail);font-family:var(--sans);color:var(--ink)}

/* ── stage ─────────────────────────────────────────────────────────────── */
#stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--rail)}
#deck{
  position:relative;width:100vw;height:100vh;max-width:calc(100vh * 16 / 9);max-height:calc(100vw * 9 / 16);
  background:var(--paper);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 40px 120px rgba(0,0,0,.5);
}

/* ── the app's chrome, as slide furniture ──────────────────────────────── */
.rail{position:absolute;left:0;top:0;bottom:0;width:clamp(44px,3.6vw,62px);background:var(--rail);z-index:3;
      display:flex;flex-direction:column;align-items:center;padding:1.1rem 0;gap:.9rem}
.rail-mark{width:60%;aspect-ratio:1;border-radius:22%;background:var(--rail-icon);border:2px solid var(--mauve-dim);
      display:grid;place-items:center;color:#fff;font:800 clamp(9px,.85vw,13px)/1 var(--sans);letter-spacing:.5px}
.rail-dots{margin-top:auto;margin-bottom:.4rem;display:flex;flex-direction:column;gap:3.5px;align-items:center}
.rail-dot{width:4px;height:4px;border-radius:50%;background:#ffffff21;transition:background .25s,transform .25s}
.rail-dot.on{background:#fff;transform:scale(1.9)}
.band{position:absolute;left:clamp(44px,3.6vw,62px);top:0;bottom:0;width:clamp(8px,.7vw,12px);background:var(--aubergine);z-index:3}

/* ── slides ────────────────────────────────────────────────────────────── */
#slides{position:absolute;inset:0 0 0 calc(clamp(44px,3.6vw,62px) + clamp(8px,.7vw,12px));background:var(--paper)}
.slide{position:absolute;inset:0;padding:clamp(1.4rem,2.6vh,2.4rem) clamp(1.8rem,3.4vw,3.4rem);
       display:grid;grid-template-rows:auto 1fr auto;opacity:0;pointer-events:none;visibility:hidden;
       --base:clamp(11px,1.16vw,19px);font-size:calc(var(--base) * var(--fit,1))}
.slide.live{opacity:1;pointer-events:auto;visibility:visible}

/* top bar: who (left) · counter (right) */
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.who{display:flex;align-items:center;gap:.6rem}
.who .av{width:clamp(28px,2.4vw,38px);aspect-ratio:1;border-radius:7px;background:var(--aubergine);color:#fff;
      display:grid;place-items:center;font:800 clamp(10px,.85vw,13px)/1 var(--sans);letter-spacing:.3px}
.who .nm{font-weight:800;font-size:clamp(12px,1.05vw,16px);letter-spacing:-.01em}
.who .rl{font:500 clamp(9px,.72vw,11.5px)/1.3 var(--mono);color:var(--muted);letter-spacing:.02em}
.count{font:600 clamp(10px,.8vw,12.5px)/1 var(--mono);color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.count b{color:var(--blue);font-weight:700}

/* body: text left · visual right */
.body{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:clamp(1rem,2.2vw,2.4rem);
      align-items:safe center;align-content:safe center;padding:.5em 0;min-height:0;overflow:hidden}
/* Long slides keep their visual — they're the ones that need it most. Tighten
   the type instead of throwing the picture away. */
.slide[data-dense] .body{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-content:center}
.slide[data-dense] li{line-height:1.42;max-width:44ch}
.slide[data-dense] ul{gap:.42em}
.slide[data-dense] h1{font-size:2.1em}
.slide[data-dense] .hr{margin:.6rem 0 .75rem}
.ghost{position:absolute;left:clamp(1.4rem,2.6vw,2.6rem);bottom:clamp(.6rem,2vh,1.4rem);
       font:900 clamp(64px,8.5vw,124px)/.78 var(--sans);color:#1d1c1d0a;letter-spacing:-.06em;z-index:0;user-select:none}

h1{font-size:2.5em;line-height:1.04;letter-spacing:-.034em;font-weight:800;max-width:20ch}
.kicker{font:700 .63em/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
        color:var(--blue);margin-bottom:.6rem}
.hr{width:3.4em;height:.26em;background:var(--aubergine);margin:1rem 0 1.3rem;transform-origin:left}

ul{list-style:none;display:flex;flex-direction:column;gap:.72em}
li{position:relative;padding-left:1.05em;font-size:1.1em;line-height:1.4;color:#2c2b2c;max-width:30ch}
li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--blue);border-radius:1px}
li b{color:var(--ink);font-weight:700}
li i{font-style:italic;color:var(--muted)}
li code{font:500 .88em/1 var(--mono);background:var(--wash);border:1px solid var(--rule);border-radius:3px;padding:.1em .35em}

/* tech chips — brand colour, honest, no fake logos */
.tech{display:flex;flex-wrap:wrap;gap:.34em;margin-top:.9em}
.chip{display:inline-flex;align-items:center;gap:.36em;border:1px solid var(--rule);border-radius:999px;
      padding:.26em .62em .26em .48em;font:600 .64em/1 var(--mono);color:#3a3a3a;background:var(--paper);
      white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}

/* a rendered table, where the table IS the argument */
table{width:100%;border-collapse:collapse;font-size:1.02em}
caption{caption-side:top;text-align:left;font:700 clamp(8px,.62vw,10px)/1 var(--mono);letter-spacing:.14em;
        text-transform:uppercase;color:var(--muted);padding-bottom:.5rem}
th,td{border:1px solid var(--rule);padding:.74em .8em;text-align:left;vertical-align:middle}
thead th{background:var(--aubergine);color:#fff;font:700 .92em/1.3 var(--mono);letter-spacing:.04em}
thead th:last-child{background:var(--blue)}
tbody th{background:var(--wash);font-weight:700;color:var(--ink);width:1%;white-space:nowrap}
td{color:#3c3b3c}
td.y{color:#2bac76;font-weight:800;text-align:center}
td.n{color:#c9c9c9;font-weight:800;text-align:center}
td.p{color:#e8a33d;font-weight:800;text-align:center}
tbody tr:last-child th,tbody tr:last-child td{background:#1164a30d;font-weight:700}

/* ── diagram kit ──────────────────────────────────────────────────────────
   Everything that isn't a screenshot of the product is drawn here. Components
   carry their tech's brand colour as a bar, so the stack reads at a glance. */
.dg{font-size:1.02em;width:100%;line-height:1.35;display:flex;flex-direction:column;gap:.7em;align-items:center}
.dg-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:.12em;
  border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:.5em .7em;
  box-shadow:0 1px 2px #1d1c1d0d;white-space:nowrap;font-weight:700;color:var(--ink);overflow:hidden}
.dg-box .dg-t{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#999)}
.dg-box code{font:500 .82em/1 var(--mono);color:var(--muted);font-weight:500}
.dg-box small{font:500 .74em/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dg-box.wide{padding:.55em 2em}
.dg-box.dg-ghost{border-style:dashed;box-shadow:none;background:transparent}
.dg-box.bad{border-color:#e01e5a55;background:#e01e5a08}
.dg-box.bad code{color:#e01e5a;text-decoration:line-through}
.dg-box.good{border-color:#2bac7655;background:#2bac7608}
.dg-box.good code{color:#2bac76}
.dg-row{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;justify-content:center}
.dg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.4em;width:100%}
.dg-a{font:600 .82em/1 var(--mono);color:var(--muted);font-style:normal;white-space:nowrap}
.dg-a2{color:var(--blue);font-weight:700}
.dg-v{color:var(--rule);font-size:1.1em;font-style:normal;line-height:.6}
.dg-cap{font-size:.86em;flex-wrap:wrap;color:var(--muted);text-align:center;display:flex;align-items:center;gap:.5em;justify-content:center}

/* architecture */
.dg-arch{width:100%}
.dg-tier{width:100%;position:relative;border:1px solid var(--rule);border-radius:5px;padding:.7em .6em .6em;background:var(--wash)}
.dg-tier-l{position:absolute;top:-.62em;left:.7em;background:var(--paper);padding:0 .4em;
  font:700 .7em/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dg-gate{width:100%;display:flex;flex-direction:column;align-items:center;gap:.3em;
  border:2px solid var(--aubergine);border-radius:5px;padding:.6em;background:#3f0e400a}
.dg-gate small{font:500 .78em/1 var(--mono);color:var(--muted)}

/* hub-and-spoke: satellites above and below, the thing that matters across the middle */
.dg-hub{width:100%}
.hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55em;width:100%;place-items:stretch}
.hub-n{position:relative;border:1px solid var(--rule);border-radius:5px;background:var(--paper);
  padding:1.05em .5em;text-align:center;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;box-shadow:0 1px 2px #1d1c1d0d}
.hub-n::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--rule))}
.hub-n.on::before{background:var(--blue)}
.hub-c{grid-column:1/4;background:var(--blue);color:#fff;border-radius:5px;padding:1.25em .85em;text-align:center;
  font-weight:800;font-size:1.12em;letter-spacing:-.01em;display:flex;flex-direction:column;gap:.1em;
  box-shadow:0 6px 18px #1164a340}
.hub-c small{font:500 .62em/1 var(--mono);color:#ffffffb3;text-transform:uppercase;letter-spacing:.1em}
.hub-c.bad{background:var(--aubergine);box-shadow:0 6px 18px #3f0e4040}
/* a row of satellites that centres itself however many there are */
.hub-row{grid-column:1/4;display:flex;gap:.55em}
.hub-row > *{flex:1}

/* realtime lanes */
.dg-flow{width:100%;align-items:stretch}
.dg-lane{border:1px solid var(--rule);border-radius:5px;padding:.75em .6em .6em;position:relative;background:var(--paper)}
.dg-lane.hot{border-color:var(--blue);background:#1164a308}
.dg-lane-t{position:absolute;top:-.6em;left:.7em;background:var(--paper);padding:0 .4em;
  font:700 .72em/1 var(--mono);letter-spacing:.06em;color:var(--muted)}
.dg-lane.hot .dg-lane-t{color:var(--blue)}
.dg-sub{text-align:center;font:500 .8em/1 var(--mono);color:var(--muted);margin-top:.5em}
.dg-side{margin-top:.1em}

/* identity */
.dg-auth{width:100%}
.dg-gatebox{display:flex;flex-direction:column;gap:.4em;align-items:center;border:2px solid var(--aubergine);
  border-radius:5px;padding:.6em .7em;background:#3f0e400a}
.dg-gatebox ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:.16em;font-size:.86em}
.dg-gatebox li{counter-increment:s;position:relative;padding-left:1.3em;white-space:nowrap;color:#3c3b3c}
.dg-gatebox li::before{content:counter(s);position:absolute;left:0;top:.05em;width:1em;height:1em;border-radius:50%;
  background:var(--aubergine);color:#fff;font:700 .68em/1em var(--mono);text-align:center}
.dg-gatebox li.strike{font-weight:700;color:var(--ink)}
.dg-gatebox code{font:500 .84em/1 var(--mono);background:var(--wash);padding:0 .25em;border-radius:2px}

/* mobile */
.dg-layers{width:100%}
.dg-chain{display:flex;align-items:center;gap:.35em;flex-wrap:wrap;justify-content:center}
.dg-tree{align-self:stretch;border:1px solid var(--rule);border-radius:5px;background:var(--wash);
  padding:.7em .8em;font:500 .88em/1.6 var(--mono);color:#3c3b3c}
.dg-tree b{color:var(--ink)}
.dg-tree .in{padding-left:1.6em}
.dg-tree small{color:var(--muted)}

/* visual placeholder */
figure{border:2px dashed #c9c9c9;border-radius:4px;background:
   repeating-linear-gradient(45deg,#fbfbfb 0 9px,#f4f4f4 9px 18px);
   display:grid;place-items:center;padding:clamp(.7rem,1.6vw,1.3rem);aspect-ratio:var(--ar,16/9);width:100%;
   max-height:80vh;justify-self:stretch;position:relative;overflow:hidden}
figure[data-kind=live]{border-color:var(--blue);background:
   repeating-linear-gradient(45deg,#f2f8fd 0 9px,#eaf3fb 9px 18px)}
figcaption{font-size:.8em;line-height:1.55;color:#5a5a5a;text-align:center;max-width:40ch}
.tag{position:absolute;top:0;left:0;background:#c9c9c9;color:#fff;font:700 clamp(7.5px,.6vw,9.5px)/1 var(--mono);
     letter-spacing:.1em;padding:.28rem .5rem;border-radius:0 0 4px 0}
figure[data-kind=live] .tag{background:var(--blue)}
figure[data-kind=shot] .tag{background:var(--aubergine)}
figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
/* a real screenshot has arrived — drop the placeholder chrome */
figure.has{border:1px solid var(--rule);background:var(--wash);box-shadow:0 8px 30px #1d1c1d1f}
figure.has figcaption,figure.has .tag{display:none}

/* bottom-right: who's next */
.foot{display:flex;justify-content:flex-end;align-items:flex-end;padding-top:.6rem}
.next{display:flex;align-items:center;gap:.7em;border-left:3px solid var(--aubergine);padding:.15em 0 .15em .8em;max-width:min(40ch,58%)}
.next-b{display:flex;flex-direction:column;gap:.15em}
.next .lbl{font:700 .58em/1 var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.next .nm{font-weight:800;font-size:1.05em;letter-spacing:-.015em;line-height:1.1}
.next-r{width:1.6em;height:2px;background:var(--rule);margin:.15em 0}
.next .hint{font-size:.72em;color:var(--muted);line-height:1.35}
.next .av{width:2.3em;aspect-ratio:1;border-radius:6px;background:var(--aubergine);border:none;
      color:#fff;display:grid;place-items:center;font:800 .72em/1 var(--sans);flex:none}

/* ── entrance choreography ─────────────────────────────────────────────── */
.slide.live .anim{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
.slide.live .hr{animation:grow .5s cubic-bezier(.22,1,.36,1) both;animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ── the wipe: the brand colour sweeps the change ──────────────────────── */
#wipe{position:absolute;inset:0;z-index:20;pointer-events:none;display:flex}
#wipe span{flex:1;background:var(--aubergine);transform:scaleY(0);transform-origin:bottom}
#wipe span:nth-child(2){background:var(--aubergine-dark)}
#wipe span:nth-child(3){background:var(--rail-icon)}
#wipe span:nth-child(4){background:var(--rail)}
#wipe.in span{animation:wipeIn .42s cubic-bezier(.7,0,.3,1) both}
#wipe.out span{animation:wipeOut .42s cubic-bezier(.7,0,.3,1) both}
#wipe span:nth-child(1){animation-delay:0s}   #wipe span:nth-child(2){animation-delay:.045s}
#wipe span:nth-child(3){animation-delay:.09s} #wipe span:nth-child(4){animation-delay:.135s}
@keyframes wipeIn{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
@keyframes wipeOut{from{transform:scaleY(1);transform-origin:top}to{transform:scaleY(0);transform-origin:top}}

/* ── progress ──────────────────────────────────────────────────────────── */
#bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#00000010;z-index:5}
#bar i{display:block;height:100%;background:var(--blue);transition:width .42s cubic-bezier(.22,1,.36,1)}

/* ── presenter notes (n) ───────────────────────────────────────────────── */
#notes{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--aubergine);color:#fff;
       padding:1rem 1.4rem 1.2rem;transform:translateY(101%);transition:transform .32s cubic-bezier(.22,1,.36,1);
       border-top:3px solid var(--blue);max-height:58%;overflow:auto}
#notes.on{transform:none}
.ncols{display:grid;grid-template-columns:1fr 1.25fr;gap:1.6rem;align-items:start}
.ncols h4{margin-bottom:.5rem}
#notes h4{font:700 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mauve-dim);margin-bottom:.6rem}
#notes ul{gap:.35rem}
#notes li{color:#f0e9f0;font-size:12.5px;line-height:1.5;max-width:none}
#notes li::before{background:var(--mauve-dim)}
#notes li b{color:#fff}
#notes li i{color:var(--mauve)}
#notes .t{position:absolute;right:1.4rem;top:1rem;font:700 11px/1 var(--mono);color:var(--mauve-dim)}

/* ── grid overview (g) ─────────────────────────────────────────────────── */
#grid{position:fixed;inset:0;z-index:30;background:#2a0630f2;padding:2.5vh 2.5vw;overflow:auto;
      display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;align-content:start}
#grid.on{display:grid}
.cell{background:var(--paper);border-radius:3px;padding:.55rem .6rem;cursor:pointer;border:2px solid transparent;
      transition:transform .14s,border-color .14s;min-height:74px;display:flex;flex-direction:column;gap:.22rem}
.cell:hover{transform:translateY(-2px);border-color:var(--blue)}
.cell.here{border-color:var(--blue)}
.cell .n{font:700 9px/1 var(--mono);color:var(--blue)}
.cell .t{font-weight:700;font-size:10.5px;line-height:1.25;letter-spacing:-.01em}
.cell .w{font:500 8.5px/1 var(--mono);color:var(--muted);margin-top:auto}

/* ── help ──────────────────────────────────────────────────────────────── */
#help{position:fixed;right:10px;bottom:9px;z-index:40;font:500 10px/1 var(--mono);color:#ffffff4d;letter-spacing:.06em}
#help b{color:#ffffff9e;font-weight:700}
@media print{#help,#bar,#notes{display:none}}
@media (prefers-reduced-motion:reduce){
  .slide.live .anim,.slide.live .hr,#wipe span{animation:none!important}
  #wipe{display:none}
}
</style>
</head>
<body>
<div id="stage">
  <div id="deck">
    <div class="rail">
      <div class="rail-mark">VO</div>
      <div class="rail-dots" id="dots"></div>
    </div>
    <div class="band"></div>
    <div id="slides"></div>
    <div id="wipe"><span></span><span></span><span></span><span></span></div>
    <div id="notes"><span class="t"></span><div class="ncols"><div><h4>How to deliver this</h4><ul id="nhow"></ul></div><div><h4>Talking points</h4><ul id="nsay"></ul></div></div></div>
    <div id="bar"><i></i></div>
  </div>
</div>
<div id="grid"></div>
<div id="help"><b>←→</b> move · <b>N</b> notes · <b>G</b> grid · <b>F</b> full</div>

<script>
const SLIDES = [
 {
  "n": 1,
  "title": "Title & Team",
  "who": "Mousa",
  "initials": "MO",
  "role": "Backend · Security & Services",
  "time": "~30s",
  "bullets": [
   "Who we are — Frontend · Backend · Mobile",
   "Agenda: problem → what → how → demo"
  ],
  "notes": [
   "Don&#x27;t linger",
   "Names, roles, one line on the product, then move",
   "The panel is deciding whether you&#x27;re organised — brisk says yes"
  ],
  "script": [
   "Project name, one line of what it is: <i>&quot;a virtual office that puts your people, chat, tasks and meetings in one place.&quot;</i>",
   "Introduce the team and what each person owned: Frontend, Backend, Mobile.",
   " the problem → what we built → how it works → demo.Say the agenda in one sentence:"
  ],
  "tech": [],
  "visual": {
   "kind": "diagram",
   "desc": "Title card — project name + the six of you. A team photo works better than a logo.",
   "ratio": "16/9",
   "table": null,
   "html": null
  },
  "next": null
 },
 {
  "n": 2,
  "title": "The Problem",
  "who": "Mousa",
  "initials": "MO",
  "role": "Backend · Security & Services",
  "time": "~1m",
  "bullets": [
   "Remote broke what the office gave free",
   "Who&#x27;s online? · app-switching · no presence · scattered",
   "<i>“Five tools all day, still don&#x27;t know what the team is doing”</i>"
  ],
  "notes": [
   "The only slide where you&#x27;re allowed to be human before you&#x27;re technical",
   "Slow down on the four pains",
   "Land the closing line, then <b>pause for a beat</b> — silence sells it"

   "So we let you <b>ask instead of read</b>: <i>&quot;Catch me up — what did I miss?&quot;</i>",
   "<b>The detail worth stressing:</b> it summarises only what <b>you</b> actually haven&#x27;t read — it uses your real unread position, not &quot;the last 50 messages&quot;. The answer is about <i>your</i> gap, not a generic recap. And reading it doesn&#x27;t mark anything read, so your unread badges survive.",

  ],
  "script": [
   "Slide 9 was the <i>why</i>. This is the <i>how</i> — and it&#x27;s the one part of the stack that isn&#x27;t a normal web app.",
   "<b>Phaser 3</b> — an actual 2D game engine, because a floor plan with people walking on it <b>is</b> a game loop: 60fps rendering, a <b>Tiled</b> tilemap with collision, sprite animation, a camera that follows your character. Building that from DOM elements would be a fight you lose; Phaser gives it away.",
   "<b>Colyseus</b> — an authoritative multiplayer server. It runs as its <b>own Node service</b>, separate from the Spring backend.",
   "<b>The question you will be asked — have this ready:</b> <i>&quot;You already have WebSockets for chat. Why a second realtime stack?&quot;</i> Because they are <b>opposite problems</b>:",
   "<b>How the world syncs:</b> the server owns <code>OfficeState</code>. <code>@type</code> decorators on the schema make Colyseus send <b>binary deltas</b> — only what changed, not the whole world. A <code>Player</code> carries <code>x, y, anim, status, floor</code>; the decorators <i>are</i> the network protocol.",
   "<b>Multi-tenancy in one line:</b> <code>gameServer.define(WORKSPACE, SkyOffice).filterBy([&#x27;workspaceId&#x27;])</code> — everyone with the same <code>workspaceId</code> lands in the same room, and two companies can never see each other. One line, complete isolation.",

   "<b>The line:</b> <i>&quot;Identity is decided once, at the edge. Every service trusts the gateway and nothing else.&quot;</i>"

 {

  "title": "Live Demo & Close",

const $ = (s,r=document)=>r.querySelector(s);
const slidesEl=$('#slides'), wipe=$('#wipe'), bar=$('#bar i'), notes=$('#notes'), grid=$('#grid'), dots=$('#dots');
let i = Math.min(Math.max(parseInt(location.hash.slice(1))-1||0,0), SLIDES.length-1);
let busy = false;

const chip = t => `<span class="chip" style="--c:${t.color}"><i></i>${t.name}</span>`;
const KIND = {shot:'screenshot', diagram:'diagram — draw this', live:'live on stage', table:''};
const MARK = {y:['y','✓'], n:['n','—'], '~':['p','~']};
function tableHTML(t){
  const cell = v => MARK[v] ? `<td class="${MARK[v][0]}">${MARK[v][1]}</td>` : `<td>${v}</td>`;
  return `<table><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    t.rows.map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(cell).join('')}</tr>`).join('')}</tbody></table>`;
}

function render(){
  slidesEl.innerHTML = SLIDES.map((s,idx)=>{
    const v = s.visual;
    return `<section class="slide" data-i="${idx}"${s.bullets.length>6?' data-dense':''}>
      <div class="top">
        <div class="who">
          <span class="av">${s.initials}</span>
          <span><span class="nm">${s.who}</span><br><span class="rl">${s.role}</span></span>
        </div>
        <div class="count"><b>${String(s.n).padStart(2,'0')}</b> / ${SLIDES.length} &nbsp;·&nbsp; ${s.time.replace('~','')}</div>
      </div>
      <div class="body">
        <div>
          <div class="kicker anim" style="animation-delay:.04s">${s.n===1?'Graduation Project':'Virtual Office'}</div>
          <h1 class="anim" style="animation-delay:.07s">${s.title}</h1>
          <div class="hr"></div>
          <ul>${s.bullets.map((b,k)=>`<li class="anim" style="animation-delay:${.16+k*.05}s">${b}</li>`).join('')}</ul>
          ${s.tech.length?`<div class="tech anim" style="animation-delay:${.16+s.bullets.length*.05}s">${s.tech.map(chip).join('')}</div>`:''}
        </div>
        ${v.kind==='diagram-built'
           ? `<div class="anim" style="animation-delay:.2s">${v.html}</div>`
           : v.kind==='table'
           ? `<div class="anim" style="animation-delay:.2s">${tableHTML(v.table)}</div>`
           : `<figure class="anim" data-kind="${v.kind}" style="--ar:${v.ratio};animation-delay:.2s" data-shot="slide-${String(s.n).padStart(2,'0')}">
          <span class="tag">${KIND[v.kind]}</span>
          <figcaption>${v.desc}</figcaption>
          <img src="shots/slide-${String(s.n).padStart(2,'0')}.png" alt=""
               onload="this.closest('figure').classList.add('has')" onerror="this.remove()">
        </figure>`}
      </div>
      <div class="foot">
        ${s.next?`<div class="next anim" style="animation-delay:.3s">
          <span class="av">${s.next.initials}</span>
          <span class="next-b"><span class="lbl">Next</span>
            <span class="nm">${s.next.name}</span>
            <i class="next-r"></i>
            <span class="hint">${s.next.hint}</span></span>
        </div>`:''}
      </div>
      <div class="ghost">${String(s.n).padStart(2,'0')}</div>
    </section>`;
  }).join('');
  dots.innerHTML = SLIDES.map(()=>'<i class="rail-dot"></i>').join('');
  grid.innerHTML = SLIDES.map((s,idx)=>`<div class="cell" data-i="${idx}">
      <span class="n">${String(s.n).padStart(2,'0')}</span>
      <span class="t">${s.title}</span><span class="w">${s.who}</span></div>`).join('');
  grid.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{go(+c.dataset.i);grid.classList.remove('on')});
  show(i,true);
}

// Nothing may clip: shrink the slide until its body fits. Cheaper and more
// honest than guessing font sizes per slide.
function fit(el){
  const body = el.querySelector('.body'); if(!body) return;
  el.style.setProperty('--fit', 1);
  for(let f = 1; f > .58 && body.scrollHeight > body.clientHeight + 1; f -= .035)
    el.style.setProperty('--fit', f.toFixed(3));
}
function paint(){
  slidesEl.querySelectorAll('.slide').forEach((el,k)=>el.classList.toggle('live',k===i));
  dots.querySelectorAll('.rail-dot').forEach((d,k)=>d.classList.toggle('on',k===i));
  grid.querySelectorAll('.cell').forEach((c,k)=>c.classList.toggle('here',k===i));
  bar.style.width = ((i+1)/SLIDES.length*100)+'%';
  const cur = slidesEl.querySelector('.slide.live'); if(cur) fit(cur);
  const s = SLIDES[i];
  $('#nhow').innerHTML = s.notes.map(n=>`<li>${n}</li>`).join('');
  $('#nsay').innerHTML = (s.script||[]).map(n=>`<li>${n}</li>`).join('');
  $('#notes .t').textContent = s.time.replace('~','');
  location.hash = i+1;
}
function show(n,instant){
  i = (n+SLIDES.length)%SLIDES.length;
  if(instant){paint();return;}
  paint();
}
function go(n){
  if(busy || n===i) return;
  busy = true;
  // brand-coloured wipe: four columns sweep up, the slide swaps behind them, they sweep away
  wipe.className='in';
  setTimeout(()=>{ show(n); wipe.className='out'; }, 300);
  setTimeout(()=>{ wipe.className=''; busy=false; }, 780);
}
const next=()=>go(i+1), prev=()=>go(i-1);

addEventListener('resize', ()=>{const c=slidesEl.querySelector('.slide.live'); if(c) fit(c);});
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key==='Home'){go(0)} else if(e.key==='End'){go(SLIDES.length-1)}
  else if(e.key==='n'||e.key==='N'){notes.classList.toggle('on')}
  else if(e.key==='g'||e.key==='G'){grid.classList.toggle('on')}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(e.key==='Escape'){grid.classList.remove('on');notes.classList.remove('on')}
});
addEventListener('click', e=>{
  if(e.target.closest('#grid,#notes,#help')) return;
  (e.clientX > innerWidth*0.5) ? next() : prev();
});
let x0=null;
addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{ if(x0===null)return; const d=e.changedTouches[0].clientX-x0;
  if(Math.abs(d)>50)(d<0?next():prev()); x0=null; },{passive:true});

render();
</script>
