apiVersion: 1
datasources:
  - name: Loki
    type: loki
    # Pinned so provisioned dashboards can reference it by a stable uid. Without
    # this Grafana generates a random uid and every panel in a provisioned
    # dashboard comes up as "datasource not found".
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
